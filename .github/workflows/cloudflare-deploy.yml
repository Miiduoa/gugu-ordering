name: Cloudflare owned-account release checks

on:
  push:
    branches: [cloudflare-production]
    paths:
      - 'cloudflare/**'
      - '.github/workflows/cloudflare-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gugu-cloudflare-release-checks
  cancel-in-progress: true

jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate isolated application
        working-directory: cloudflare
        run: |
          npm run build
          npm test
      - name: Explain permanent account deployment
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Source verified; account authorization still required

          This job does not create an account, database, or public deployment.
          Temporary-account provisioning has been removed from this workflow.
          A successful check is not evidence of a production deployment.

          [Deploy directly into your own Cloudflare account](https://deploy.workers.cloudflare.com/?url=https://github.com/Miiduoa/gugu-ordering/tree/cloudflare-production/cloudflare)

          Use Workers Free, a NEW dedicated D1 database, and static assets only.
          Do not select an existing unrelated database or enable paid services.
          Follow cloudflare/DEPLOY.md for account authorization and activation.
          EOF
